# Temporary read-only formatter bootstrap. Delete after formatted sources are committed.
name: Phase 1 formatter bootstrap
on:
  push:
    branches: [feat/phase1-objectbox-foundation]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Apply project SDK formatter
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format lib test
      - name: Emit only reviewed formatted source files
        working-directory: apps/mobile
        run: |
          for file in \
            lib/core/storage/objectbox_store_provider.dart \
            lib/features/workouts/data/objectbox_workout_repository.dart \
            lib/features/workouts/data/workout_entities.dart \
            lib/features/workouts/domain/workout_models.dart \
            lib/features/workouts/domain/workout_repository.dart \
            lib/main.dart \
            lib/objectbox.g.dart \
            test/workouts/workout_domain_test.dart; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
