# Temporary, read-only helper for Flutter SDK formatting evidence. Delete after committing.
name: PR8 final formatter check
on:
  push:
    branches: [fix/phase1-plan-archive-and-editor-review]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Format Dart
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format lib test
      - name: Emit formatted files for verified check-in
        working-directory: apps/mobile
        run: |
          for file in \
            lib/features/train/plan_editor_page.dart \
            lib/features/workouts/domain/workout_library_models.dart \
            lib/features/workouts/data/objectbox_workout_library_repository.dart \
            test/train/plan_builder_widget_test.dart \
            test/workouts/objectbox_workout_library_repository_test.dart; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Install pinned Linux ObjectBox
        working-directory: apps/mobile
        run: |
          curl -fLsS --retry 3 https://github.com/objectbox/objectbox-c/releases/download/v5.3.2/objectbox-linux-x64.tar.gz -o /tmp/objectbox-linux-x64.tar.gz
          echo '6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613  /tmp/objectbox-linux-x64.tar.gz' | sha256sum -c -
          mkdir -p /tmp/obj
          tar -xzf /tmp/objectbox-linux-x64.tar.gz -C /tmp/obj
          lib=$(find /tmp/obj -type f -name libobjectbox.so -print -quit)
          test -n "$lib"
          sudo install -m 755 "$lib" /usr/local/lib/libobjectbox.so
          sudo ldconfig
      - name: Run all tests
        working-directory: apps/mobile
        run: flutter test
