# Temporary, read-only generation job to obtain initial generator-owned UIDs.
# Remove after checking in generated artifacts. No write permissions/secrets.
name: Phase 1 ObjectBox bootstrap
on:
  push:
    branches: [feat/phase1-objectbox-foundation]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate ObjectBox bindings and model
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          test -s lib/objectbox.g.dart
          test -s lib/objectbox-model.json
      - name: Emit generated-only files to inspect and check in
        working-directory: apps/mobile
        run: |
          echo BEGIN_OBJECTBOX_CODE
          base64 -w0 lib/objectbox.g.dart
          echo
          echo END_OBJECTBOX_CODE
          echo BEGIN_OBJECTBOX_MODEL
          base64 -w0 lib/objectbox-model.json
          echo
          echo END_OBJECTBOX_MODEL
      - name: Analyze and unit-test
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test
