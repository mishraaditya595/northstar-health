# One-time helper to record output from the project's pinned Dart SDK.
# Delete after formatted sources are checked into PR #8.
name: PR8 formatting and test bootstrap
on:
  push:
    branches: [fix/phase1-plan-archive-and-editor-review]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Format and resolve
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format lib test
      - name: Emit formatted reviewed files
        working-directory: apps/mobile
        run: |
          for file in \
            lib/features/workouts/data/objectbox_workout_library_repository.dart \
            lib/features/workouts/domain/workout_library_repository.dart \
            lib/features/train/plan_editor_page.dart \
            lib/features/train/train_page.dart \
            test/workouts/objectbox_workout_library_repository_test.dart \
            test/train/plan_builder_widget_test.dart; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
      - name: Analyze formatted working tree
        working-directory: apps/mobile
        run: flutter analyze
      - name: Install ObjectBox native library (v5.3.2)
        working-directory: apps/mobile
        run: |
          curl -fLsS --retry 3 \
            https://github.com/objectbox/objectbox-c/releases/download/v5.3.2/objectbox-linux-x64.tar.gz -o /tmp/objectbox-linux-x64.tar.gz
          echo '6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613  /tmp/objectbox-linux-x64.tar.gz' | sha256sum -c -
          mkdir -p /tmp/native
          tar -xzf /tmp/objectbox-linux-x64.tar.gz -C /tmp/native
          so=$(find /tmp/native -type f -name libobjectbox.so -print -quit)
          test -n "$so"
          sudo install -m 755 "$so" /usr/local/lib/libobjectbox.so
          sudo ldconfig
      - name: Run all tests
        working-directory: apps/mobile
        run: flutter test
