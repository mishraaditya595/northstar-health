name: Supabase SQL and RLS

# Runs on every PR so the `database` check can be required in branch rules.
# The job itself is skipped (which counts as passing) only when path detection
# succeeded and found no change under supabase/ or this workflow. If detection
# fails, the full job runs (fail closed) so a required check never passes
# without validation.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase_sql.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - "supabase/**"
              - ".github/workflows/supabase_sql.yml"

  database:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.supabase == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate Docker pulls from GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # Reduce anonymous GHCR throttling on hosted runners. Retain a
          # fallback for environments where packages:read is unavailable.
          if ! printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning::GHCR login unavailable; trying public image pulls."
          fi
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.81.3"
      - name: Start clean local database
        run: |
          # setup-cli forces a GHCR-only mirror. Remove that override to let
          # the pinned CLI fall back across ECR, GHCR and Docker Hub if one
          # registry is rate-limited. GHCR remains authenticated when chosen.
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          # Without pipefail, tee masks a failed supabase db start and makes
          # this step falsely pass while the later db reset mysteriously fails.
          set -o pipefail
          supabase --version
          # Supabase CLI retries image pulls internally, but GHCR can still
          # temporarily throttle shared GitHub-hosted runner IPs. Retry ONLY
          # quota failures; a real database/startup error must fail promptly.
          for attempt in 1 2 3 4; do
            if supabase db start 2>&1 | tee "$RUNNER_TEMP/supabase-db-start.log"; then
              exit 0
            fi
            if ! grep -Eiq 'toomanyrequests|429 Too Many Requests|rate limit exceeded' \
              "$RUNNER_TEMP/supabase-db-start.log"; then
              echo "::error::Supabase startup failed for a non-rate-limit reason."
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::GHCR rate limit persisted after four startup attempts."
              exit 1
            fi
            seconds=$((attempt * 20))
            echo "::warning::Transient GHCR throttling (attempt $attempt/4); retrying after ${seconds}s."
            sleep "$seconds"
          done
      - name: Reset and replay all migrations from scratch
        run: |
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          supabase db reset
      - name: Execute pgTAP SQL tests
        run: supabase test db
      - name: Install pinned Deno for Edge Function verification
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check deletion Edge Function
        run: deno check supabase/functions/delete-account/index.ts
      - name: Verify irreversible deletion endpoint with stubbed Auth clients
        run: deno test supabase/functions/delete-account/index_test.ts
