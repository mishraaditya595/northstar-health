name: Supabase SQL and RLS

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase_sql.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase_sql.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.81.3"
      - name: Start clean local database
        run: |
          supabase --version
          supabase db start
      - name: Reset and replay all migrations from scratch
        run: supabase db reset
      - name: Execute pgTAP SQL tests
        run: supabase test db
