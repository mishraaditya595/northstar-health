name: Supabase SQL and RLS

# Runs on every PR so the `database` check can be required in branch rules.
# The job itself is skipped (which counts as passing) only when path detection
# succeeded and found no change under supabase/ or this workflow. If detection
# fails, the full job runs (fail closed) so a required check never passes
# without validation.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase_sql.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - "supabase/**"
              - ".github/workflows/supabase_sql.yml"

  database:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.supabase == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.81.3"
      - name: Start clean local database
        run: |
          supabase --version
          supabase db start
      - name: Reset and replay all migrations from scratch
        run: supabase db reset
      - name: Execute pgTAP SQL tests
        run: supabase test db
      - name: Install pinned Deno for Edge Function verification
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check deletion Edge Function
        run: deno check supabase/functions/delete-account/index.ts
