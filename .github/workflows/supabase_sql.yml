name: Supabase SQL and RLS

# Runs on every PR so the `database` check can be required in branch rules.
# The job itself is skipped (which counts as passing) only when path detection
# succeeded and found no change under supabase/ or this workflow. If detection
# fails, the full job runs (fail closed) so a required check never passes
# without validation.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase_sql.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - "supabase/**"
              - ".github/workflows/supabase_sql.yml"

  database:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.supabase == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate Docker pulls from GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # Reduce anonymous GHCR throttling on hosted runners. Retain a
          # fallback for environments where packages:read is unavailable.
          if ! printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning::GHCR login unavailable; trying public image pulls."
          fi
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.81.3"
      - name: Start database, replay migrations, and run pgTAP with registry failover
        shell: bash
        run: |
          set -o pipefail
          supabase --version

          # CLI 2.81.3 does not reliably switch registries when an image
          # pull is throttled. GitHub-hosted runners can exhaust shared-IP
          # ECR/GHCR quotas even after repeated pulls to the same registry.
          # The CLI supports these official Supabase image mirrors. Try
          # another mirror ONLY on an identifiable registry quota error.
          # No migration, PostgreSQL, or pgTAP failure is masked/retried.
          run_supabase() {
            local stage="$1"
            shift
            local registry
            local log_file="$RUNNER_TEMP/supabase-${stage}.log"

            for registry in docker.io ghcr.io public.ecr.aws; do
              echo "::group::Supabase ${stage} using ${registry}"
              if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" \
                supabase "$@" 2>&1 | tee "$log_file"; then
                echo "::endgroup::"
                echo "Supabase ${stage} passed using ${registry}."
                return 0
              fi
              echo "::endgroup::"

              if ! grep -Eiq \
                'toomanyrequests|429 Too Many Requests|rate limit exceeded|Data limit exceeded' \
                "$log_file"; then
                echo "::error::Supabase ${stage} failed (not an image-registry quota issue)."
                return 1
              fi

              echo "::warning::Supabase ${stage} image pull was rate limited on ${registry}; trying another official mirror."
              sleep 5
            done

            echo "::error::All official Supabase image registry mirrors were rate limited during ${stage}."
            return 1
          }

          run_supabase start db start
          run_supabase reset db reset
          run_supabase pgtap test db
      - name: Install pinned Deno for Edge Function verification
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check deletion Edge Function
        run: deno check supabase/functions/delete-account/index.ts
      - name: Verify irreversible deletion endpoint with stubbed Auth clients
        run: deno test supabase/functions/delete-account/index_test.ts
