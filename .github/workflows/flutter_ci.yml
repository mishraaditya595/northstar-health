name: Flutter quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Bootstrap native folders if absent
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            generated_test=false
            if [ ! -f test/widget_test.dart ]; then generated_test=true; fi
            flutter create --platforms=android,ios --project-name=northstar_health --org=dev.northstar .
            if [ "$generated_test" = true ]; then rm -f test/widget_test.dart; fi
          fi
      - run: flutter pub get
      - name: Validate README prototype assets
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Verify committed Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
