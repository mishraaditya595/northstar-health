name: PR11 format, analyzer and schema proof
on:
  push:
    branches: [feat/phase1-workout-history-progress]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate indexed ObjectBox model
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
      - name: Format project Dart
        working-directory: apps/mobile
        run: dart format lib test
      - name: Emit formatted and generated source
        working-directory: apps/mobile
        run: |
          for file in \
            lib/features/progress/domain/workout_history_models.dart \
            lib/features/progress/data/objectbox_workout_history_repository.dart \
            lib/features/progress/workout_history_state.dart \
            lib/features/progress/progress_page.dart \
            lib/features/progress/workout_history_detail_page.dart \
            lib/features/workouts/data/workout_entities.dart \
            test/progress/workout_history_models_test.dart \
            test/progress/objectbox_workout_history_repository_test.dart \
            test/progress/progress_page_widget_test.dart \
            lib/objectbox.g.dart \
            lib/objectbox-model.json; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Verify generated model is committed
        working-directory: apps/mobile
        run: git diff --exit-code -- lib/objectbox-model.json lib/objectbox.g.dart
