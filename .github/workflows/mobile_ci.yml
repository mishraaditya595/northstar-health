name: Mobile and Wear quality
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate committed project runners
        run: |
          test -f apps/mobile/android/app/build.gradle.kts
          test -f apps/mobile/ios/Runner.xcodeproj/project.pbxproj
          test -f apps/mobile/pubspec.lock
      - name: Resolve from committed lockfile
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Format
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Unit and widget tests
        working-directory: apps/mobile
        run: flutter test
      - name: Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub

  wear_os:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native Wear OS debug APK
        working-directory: apps/wear_os
        run: ./gradlew :app:assembleDebug --no-daemon
