name: Mobile and Wear quality
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate committed project runners
        run: |
          test -f apps/mobile/android/app/build.gradle.kts
          test -f apps/mobile/ios/Runner.xcodeproj/project.pbxproj
          test -f apps/mobile/pubspec.lock
      - name: Resolve from committed lockfile
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Format
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Install pinned ObjectBox native library (Linux x64)
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/objectbox/objectbox-c/releases/download/v5.3.2/objectbox-linux-x64.tar.gz \
            -o /tmp/objectbox-linux-x64.tar.gz
          echo '6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613  /tmp/objectbox-linux-x64.tar.gz' | sha256sum --check
          mkdir -p /tmp/objectbox-native
          tar -xzf /tmp/objectbox-linux-x64.tar.gz -C /tmp/objectbox-native
          LIB=$(find /tmp/objectbox-native -type f -name libobjectbox.so -print -quit)
          test -n "$LIB"
          sudo install -m 755 "$LIB" /usr/local/lib/libobjectbox.so
          sudo ldconfig
      - name: Unit, widget and native ObjectBox repository tests
        working-directory: apps/mobile
        run: flutter test
      # ObjectBox's Android JNI module requires this exact side-by-side
      # CMake version. Preinstall it here instead of letting Gradle attempt an
      # unverified SDK download during :jni:configureCMakeDebug.
      - name: Install Android JNI CMake with verification and retries
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          CMAKE="$SDK_ROOT/cmake/3.22.1/bin/cmake"
          for attempt in 1 2 3; do
            if [[ -x "$CMAKE" ]] && "$CMAKE" --version | head -n 1 | grep -Fq '3.22.1'; then
              echo "CMake 3.22.1 is available for the Android JNI build."
              exit 0
            fi
            echo "Installing Android SDK CMake 3.22.1 (attempt $attempt of 3)"
            rm -rf "$SDK_ROOT/cmake/3.22.1"
            if timeout 360 "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'cmake;3.22.1' &&
              [[ -x "$CMAKE" ]] && "$CMAKE" --version | head -n 1 | grep -Fq '3.22.1'; then
              echo "CMake 3.22.1 successfully installed and verified."
              exit 0
            fi
            echo "::warning::Android CMake 3.22.1 installation or verification failed (attempt $attempt)"
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 10)); fi
          done
          echo "::error::Cannot install a valid Android CMake 3.22.1 package after three attempts."
          exit 1
      - name: Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub

  wear_os:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native Wear OS debug APK
        working-directory: apps/wear_os
        run: ./gradlew :app:assembleDebug --no-daemon
