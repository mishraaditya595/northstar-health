name: Mobile and Wear quality

# Runs on every PR so `mobile` and `wear_os` can be required in branch rules.
# On PRs each job is skipped (which counts as passing) only when path
# detection succeeded and found no change in its app, the shared contracts or
# this workflow. If detection fails, both jobs run in full (fail closed).
# Pushes to main always run everything.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      wear_os: ${{ steps.filter.outputs.wear_os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        id: filter
        with:
          filters: |
            mobile:
              - "apps/mobile/**"
              - "contracts/**"
              - ".github/workflows/mobile_ci.yml"
            wear_os:
              - "apps/wear_os/**"
              - "contracts/**"
              - ".github/workflows/mobile_ci.yml"

  mobile:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate committed project runners
        run: |
          test -f apps/mobile/android/app/build.gradle.kts
          test -f apps/mobile/ios/Runner.xcodeproj/project.pbxproj
          test -f apps/mobile/pubspec.lock
      - name: Resolve from committed lockfile
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Format
        working-directory: apps/mobile
        run: |
          dart format lib test
          # Show the exact formatting diff on failure so reviewers can
          # apply it without needing the same local Flutter SDK.
          git diff --exit-code -- lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Install pinned ObjectBox native library (Linux x64)
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/objectbox/objectbox-c/releases/download/v5.3.2/objectbox-linux-x64.tar.gz \
            -o /tmp/objectbox-linux-x64.tar.gz
          echo '6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613  /tmp/objectbox-linux-x64.tar.gz' | sha256sum --check
          mkdir -p /tmp/objectbox-native
          tar -xzf /tmp/objectbox-linux-x64.tar.gz -C /tmp/objectbox-native
          LIB=$(find /tmp/objectbox-native -type f -name libobjectbox.so -print -quit)
          test -n "$LIB"
          sudo install -m 755 "$LIB" /usr/local/lib/libobjectbox.so
          sudo ldconfig
      - name: Unit, widget and native ObjectBox repository tests
        working-directory: apps/mobile
        run: flutter test
      # ObjectBox's Android JNI module requires this exact side-by-side
      # CMake version. Preinstall it here instead of letting Gradle attempt an
      # unverified SDK download during :jni:configureCMakeDebug.
      - name: Install Android JNI CMake with verification and retries
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          CMAKE="$SDK_ROOT/cmake/3.22.1/bin/cmake"
          for attempt in 1 2 3; do
            if [[ -x "$CMAKE" ]] && "$CMAKE" --version | head -n 1 | grep -Fq '3.22.1'; then
              echo "CMake 3.22.1 is available for the Android JNI build."
              exit 0
            fi
            echo "Installing Android SDK CMake 3.22.1 (attempt $attempt of 3)"
            rm -rf "$SDK_ROOT/cmake/3.22.1"
            if timeout 360 "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'cmake;3.22.1' &&
              [[ -x "$CMAKE" ]] && "$CMAKE" --version | head -n 1 | grep -Fq '3.22.1'; then
              echo "CMake 3.22.1 successfully installed and verified."
              exit 0
            fi
            echo "::warning::Android CMake 3.22.1 installation or verification failed (attempt $attempt)"
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 10)); fi
          done
          echo "::error::Cannot install a valid Android CMake 3.22.1 package after three attempts."
          exit 1
      - name: Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub

  wear_os:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.wear_os == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build native Wear OS debug APK
        working-directory: apps/wear_os
        run: ./gradlew :app:assembleDebug --no-daemon
