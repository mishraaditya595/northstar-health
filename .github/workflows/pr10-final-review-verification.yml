# Temporary verification helper, removed before PR review.
name: PR10 final review fixes native/widget verification
on:
  push:
    branches: [feat/phase1-active-workout-logger]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Format and dependency lock
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format lib test
      - name: Emit exact formatted files
        working-directory: apps/mobile
        run: |
          for file in \
            lib/features/train/rest_timer_card.dart \
            lib/features/train/active_workout_page.dart \
            test/train/rest_timer_card_widget_test.dart \
            test/train/set_editor_safety_widget_test.dart \
            test/train/active_workout_widget_test.dart; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
      - name: Flutter analyzer
        working-directory: apps/mobile
        run: flutter analyze
      - name: Install native ObjectBox
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/objectbox/objectbox-c/releases/download/v5.3.2/objectbox-linux-x64.tar.gz -o /tmp/objectbox-linux-x64.tar.gz
          echo '6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613  /tmp/objectbox-linux-x64.tar.gz' | sha256sum -c -
          mkdir -p /tmp/ob
          tar -xzf /tmp/objectbox-linux-x64.tar.gz -C /tmp/ob
          lib=$(find /tmp/ob -type f -name libobjectbox.so -print -quit)
          test -n "$lib"
          sudo install -m 755 "$lib" /usr/local/lib/libobjectbox.so
          sudo ldconfig
      - name: Flutter and native ObjectBox tests
        working-directory: apps/mobile
        run: flutter test
