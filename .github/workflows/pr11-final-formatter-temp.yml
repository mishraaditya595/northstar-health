name: PR11 final pinned Dart formatting
on:
  push:
    branches: [feat/phase1-workout-history-progress]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Apply Dart formatting
        working-directory: apps/mobile
        run: dart format lib test
      - name: Emit relevant formatted sources
        working-directory: apps/mobile
        run: |
          for file in lib/features/progress/progress_page.dart test/progress/progress_page_widget_test.dart; do
            echo "BEGIN_FORMAT:$file"
            base64 -w0 "$file"
            echo
            echo "END_FORMAT:$file"
          done
