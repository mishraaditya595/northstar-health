# Temporary, read-only CI helper. Delete after committing Dart formatter output.
name: PR9 pinned format and native test bootstrap
on:
  push:
    branches: [feat/phase1-live-workout-engine]
permissions:
  contents: read
jobs:
  format-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Format Dart with project SDK
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format lib test
      - name: Emit exact formatted changed Dart files
        working-directory: apps/mobile
        run: |
          for file in \
            lib/features/workouts/domain/live_workout_engine.dart \
            lib/features/workouts/data/objectbox_live_workout_engine.dart \
            lib/features/workouts/data/objectbox_workout_repository.dart \
            test/workouts/objectbox_live_workout_engine_test.dart; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
      - name: Analyze formatted tree
        working-directory: apps/mobile
        run: flutter analyze
      - name: Install pinned ObjectBox native on Linux
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/objectbox/objectbox-c/releases/download/v5.3.2/objectbox-linux-x64.tar.gz -o /tmp/objectbox-linux-x64.tar.gz
          echo '6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613  /tmp/objectbox-linux-x64.tar.gz' | sha256sum -c -
          mkdir -p /tmp/ob
          tar -xzf /tmp/objectbox-linux-x64.tar.gz -C /tmp/ob
          lib=$(find /tmp/ob -type f -name libobjectbox.so -print -quit)
          test -n "$lib"
          sudo install -m 755 "$lib" /usr/local/lib/libobjectbox.so
          sudo ldconfig
      - name: Run native ObjectBox and widget tests
        working-directory: apps/mobile
        run: flutter test
