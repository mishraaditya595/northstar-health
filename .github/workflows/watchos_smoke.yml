name: WatchOS standalone build proof (manual)

# Runs on every PR so the `watch` check can be required in branch rules.
# The macOS job is skipped (which counts as passing) only when path detection
# succeeded and found no change under apps/watch_os/, contracts/ or this workflow. A manual
# run, or failed detection, runs the full build (fail closed).
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      watch: ${{ steps.filter.outputs.watch }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            watch:
              - "apps/watch_os/**"
              - "contracts/**"
              - ".github/workflows/watchos_smoke.yml"
            ios:
              - "apps/watch_os/**"
              - "apps/mobile/ios/**"
              - "contracts/**"
              - ".github/workflows/watchos_smoke.yml"

  watch:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.watch == 'true')
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test BeyondRepWatchCore package
        run: swift test --package-path apps/watch_os/Packages/BeyondRepWatchCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate watchOS proof project
        working-directory: apps/watch_os
        run: xcodegen generate --spec project.yml
      - name: Build unsigned watchOS Simulator proof target
        working-directory: apps/watch_os
        run: |
          xcodebuild -project BeyondRepWatch.xcodeproj -scheme BeyondRepWatch \
            -configuration Debug -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  # The iPhone Runner with the Apple Watch app embedded (ADR-0004, ADR-0012).
  # Unsigned simulator build: it proves the target links, compiles and is copied
  # into Runner.app/Watch. It does not prove signing or a TestFlight upload.
  ios-with-watch:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.ios == 'true')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve from committed lockfile
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Build the iPhone simulator app (unsigned)
        working-directory: apps/mobile
        run: flutter build ios --simulator --debug --no-codesign
      - name: Assert the watch app is embedded
        working-directory: apps/mobile
        run: |
          test -d build/ios/iphonesimulator/Runner.app/Watch/BeyondRepWatch.app
          ls build/ios/iphonesimulator/Runner.app/Watch

# Important: this does NOT validate signing, TestFlight packaging, watch
# permissions, background workout or real-device pairing.
