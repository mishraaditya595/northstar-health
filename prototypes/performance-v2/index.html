<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f4" />
    <title>Northstar Health — interactive prototype</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="performance-v2.css" />
    <link rel="stylesheet" href="performance-v2-theme.css" />
  </head>
  <body>
    <main class="prototype-stage">
      <section class="intro-lockup" aria-label="Prototype introduction">
        <div class="brand-mark"><span class="brand-dot"></span> Northstar</div>
        <p class="eyebrow">NORTHSTAR / PERFORMANCE V2</p>
        <h1>Built to move.<br /><em>Made to progress.</em></h1>
        <p class="intro-copy">
          An all-new performance-led experience for training, health signals and progress. All of your movement, together.
        </p>
        <div class="intro-meta">
          <span class="status-dot"></span>
          <span>Fictional demonstration data · Alex · 23 October 2026</span>
        </div>
      </section>

      <section class="device-wrap" aria-label="Northstar mobile prototype">
        <div class="device-shadow"></div>
        <div class="phone-frame">
          <div class="phone-notch"><span></span></div>
          <div id="app" class="phone-screen"></div>
        </div>
      </section>

      <aside id="prototype-rail" class="prototype-rail" aria-label="Prototype controls"></aside>
    </main>
    <script src="app.js"></script>
    <script src="performance-v2.js"></script>
    <script src="performance-v2-theme.js"></script>
  </body>
</html>
