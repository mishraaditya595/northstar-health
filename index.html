<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f4" />
    <title>Northstar Health — interactive prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="prototype-stage">
      <section class="intro-lockup" aria-label="Prototype introduction">
        <div class="brand-mark"><span class="brand-dot"></span> Northstar</div>
        <p class="eyebrow">Interactive product prototype</p>
        <h1>Training that remembers<br /><em>the whole picture.</em></h1>
        <p class="intro-copy">
          Explore the proposed mobile experience for planning workouts, logging sets,
          reviewing progress and reading health context from the devices you already own.
        </p>
        <div class="intro-meta">
          <span class="status-dot"></span>
          <span>Fictional demonstration data · Alex · 23 October 2026</span>
        </div>
      </section>

      <section class="device-wrap" aria-label="Northstar mobile prototype">
        <div class="device-shadow"></div>
        <div class="phone-frame">
          <div class="phone-notch"><span></span></div>
          <div id="app" class="phone-screen"></div>
        </div>
      </section>

      <aside id="prototype-rail" class="prototype-rail" aria-label="Prototype controls"></aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
