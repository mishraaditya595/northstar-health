name: BeyondRepWatch
options:
  bundleIdPrefix: in.beyondrep
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  BeyondRepWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
        excludes:
          - Resources/Info.plist
      - path: Packages/BeyondRepWatchCore/Sources/BeyondRepWatchCore
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.beyondrep.app.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: in.beyondrep.app
        INFOPLIST_KEY_CFBundleDisplayName: BeyondRep
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BeyondRepWatch.entitlements
        INFOPLIST_FILE: Sources/Resources/Info.plist
        INFOPLIST_KEY_NSHealthShareUsageDescription: BeyondRep reads your sleep, steps, heart rate, HRV and active energy to show them on your watch and during a workout.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: BeyondRep saves each strength workout you finish on your watch to Apple Health.
