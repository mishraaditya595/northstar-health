  supabase-database:
    name: "MANUAL - Supabase - Database migrations"
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: .
    # Manual only: no webhook, schedule, publishing or artifacts.
    inputs:
      action:
        description: "Preview only, or deploy pending migrations?"
        type: choice
        options: [preview, deploy]
        default: preview
      confirm_project_ref:
        description: "For DEPLOY, replace NOT_SET with the exact protected project ref"
        type: string
        # Codemagic environment.vars rejects empty interpolated input values.
        # This sentinel never authorizes a deploy; the runner checks the exact ref.
        default: "NOT_SET"
      confirm_commit_sha:
        description: "For DEPLOY, replace NOT_SET with the full reviewed 40-character SHA"
        type: string
        default: "NOT_SET"
    environment:
      node: v22.11.0
      groups:
        - ns_supabase_deploy
      vars:
        NS_SUPABASE_ACTION: "${{ inputs.action }}"
        NS_SUPABASE_CONFIRM_PROJECT_ID: "${{ inputs.confirm_project_ref }}"
        NS_SUPABASE_CONFIRM_COMMIT_SHA: "${{ inputs.confirm_commit_sha }}"
    scripts:
      - name: "Preview or apply pending migrations"
        script: |
          bash scripts/codemagic_supabase.sh database

  supabase-functions:
    name: "MANUAL - Supabase - Edge Functions"
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: .
    # Function paths are resolved under supabase/functions; input is names only.
    inputs:
      action:
        description: "Preview only, or deploy the selected functions?"
        type: choice
        options: [preview, deploy]
        default: preview
      confirm_project_ref:
        description: "For DEPLOY, replace NOT_SET with the exact protected project ref"
        type: string
        # Codemagic environment.vars rejects empty interpolated input values.
        # This sentinel never authorizes a deploy; the runner checks the exact ref.
        default: "NOT_SET"
      confirm_commit_sha:
        description: "For DEPLOY, replace NOT_SET with the full reviewed 40-character SHA"
        type: string
        default: "NOT_SET"
      function_names:
        description: "Replace SELECT_FUNCTION with explicit space-separated names (example: delete-account)"
        type: string
        # Invalid function name by design; the validator fails closed until replaced.
        default: "SELECT_FUNCTION"
    environment:
      node: v22.11.0
      groups:
        - ns_supabase_deploy
      vars:
        NS_SUPABASE_ACTION: "${{ inputs.action }}"
        NS_SUPABASE_CONFIRM_PROJECT_ID: "${{ inputs.confirm_project_ref }}"
        NS_SUPABASE_CONFIRM_COMMIT_SHA: "${{ inputs.confirm_commit_sha }}"
        NS_SUPABASE_FUNCTIONS: "${{ inputs.function_names }}"
    scripts:
      - name: "Preview or deploy selected functions"
        script: |
          bash scripts/codemagic_supabase.sh functions
