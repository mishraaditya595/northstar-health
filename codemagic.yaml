# NorthStar Health - Codemagic CI/CD workflow skeletons
# https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
#
# Mobile/watch workflows are intentionally failing templates. The two real
# Supabase jobs are MANUAL ONLY, use Codemagic build inputs and one secured
# environment group bound to a single target project.
# No automatic triggers, signing credentials or publishing.
#
# The file MUST remain at the repository root. Application paths follow ADR-0004.
# mac_mini_m2 is used as a common starter; linux_x2 requires billing-enabled access.
# Do not enable Store / TestFlight publishing before approvals, signing and target setup.
#
# Mobile placeholders remain unconfigured. Supabase workflows import the
# private ns_supabase_deploy group; see docs/SUPABASE_CODEMAGIC_DEPLOY.md.
# Never commit keystores, .p8 API keys, provisioning profiles or Firebase/Supabase secrets.
#
# TODO per release workflow:
#   1. implement validation, build and test commands
#   2. configure environment groups, signing and final app IDs
#   3. add artifact paths and controlled publishing rules
#   4. enable only the desired branch/PR/tag triggers
#
workflows:
  quality-checks:
    name: "TEMPLATE - Quality checks"
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: .
    # No triggering block: manual-only; do NOT add push/PR triggers yet.
    # TODO command example (commented-out; verify before enabling):
    #   python3 -m unittest discover -s tool -p 'test_*.py'; cd apps/mobile && flutter analyze && flutter test
    scripts:
      - name: "Not configured - do not treat as a build"
        script: |
          echo "TEMPLATE ONLY: Run protocol checks and Flutter tests (once enabled)."
          echo "No artifact has been built or published. See docs/CODEMAGIC.md."
          exit 1

