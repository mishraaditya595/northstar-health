  mobile-ios-testflight:
    name: "MANUAL - Mobile iOS - TestFlight internal upload"
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile
    # Manual only: no triggering block. Uploads to App Store Connect for
    # INTERNAL TestFlight testing; never submits to Beta App Review or the App
    # Store. Setup and limits: docs/IOS_TESTFLIGHT_CODEMAGIC.md.
    integrations:
      app_store_connect: Codemagic Signing
    inputs:
      release_type:
        description: "What kind of release this is. The version is worked out from the highest in App Store Connect (and Google Play, if set up)"
        type: choice
        default: "Fix or optimisation"
        options:
          - "Fix or optimisation"
          - "Feature"
          - "Major"
          - "Same version, new build"
          - "Exact version"
      version_name:
        description: "Only for Exact version: a version such as 1.2.0. Leave AUTO otherwise"
        type: string
        # Codemagic environment.vars rejects empty interpolated input values.
        default: "AUTO"
      build_number:
        description: "Build number above the latest TestFlight build, or AUTO for latest + 1"
        type: string
        default: "AUTO"
    environment:
      flutter: "3.47.7"
      xcode: latest
      ios_signing:
        # Uploaded App Store profiles, referenced by name only. Automatic
        # signing fetched no profile for the embedded Apple Watch app
        # (in.beyondrep.app.watchkitapp) on the first run, 2026-11-27. See
        # docs/IOS_TESTFLIGHT_CODEMAGIC.md "Apple Watch app".
        provisioning_profiles:
          - beyondrep_app_store
          - beyondrep_watch_app_store
        # The certificate both profiles were made with (expires 2027-11-24).
        certificates:
          - Apple Distribution
      groups:
        # Not ns_google_play: Codemagic refuses to start a build that names a
        # group that does not exist, and Google Play is optional for iOS.
        - ns_mobile_supabase_public
      vars:
        NS_RELEASE_TYPE: "${{ inputs.release_type }}"
        NS_VERSION_NAME: "${{ inputs.version_name }}"
        NS_BUILD_NUMBER: "${{ inputs.build_number }}"
    scripts:
      - name: "Check public Supabase client settings"
        script: |
          set -euo pipefail
          case "${SUPABASE_URL:-}" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be the https://<ref>.supabase.co project URL."; exit 1 ;;
          esac
          case "${SUPABASE_PUBLISHABLE_KEY:-}" in
            sb_publishable_*) ;;
            *) echo "SUPABASE_PUBLISHABLE_KEY must be a publishable (public) key."; exit 1 ;;
          esac
      - name: "Resolve version name and build number"
        script: |
          python3 ../../scripts/codemagic_ios_version.py
      - name: "Install locked dependencies"
        script: |
          flutter pub get --enforce-lockfile
      - name: "Apply App Store signing profiles"
        script: |
          xcode-project use-profiles
      - name: "Check the watch app has a signing profile"
        script: |
          python3 ../../scripts/codemagic_check_watch_profile.py /Users/builder/export_options.plist
      - name: "Build signed IPA"
        script: |
          set -euo pipefail
          defines="$(mktemp)"
          trap 'rm -f "$defines"' EXIT
          python3 -c 'import json, os; print(json.dumps({k: os.environ[k] for k in ("SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY")}))' > "$defines"
          flutter build ipa --release \
            --build-name="$BEYONDREP_VERSION_NAME" \
            --build-number="$BEYONDREP_BUILD_NUMBER" \
            --dart-define-from-file="$defines" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

