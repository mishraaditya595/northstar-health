  supabase-staging-preview:
    name: "MANUAL - Supabase staging - Migration dry run"
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: .
    # No triggering: manual Codemagic UI/API invocation only, never push/PR.
    environment:
      node: v22.11.0
      groups:
        - ns_supabase_staging
      vars:
        NS_SUPABASE_TARGET: "staging"
        NS_SUPABASE_ACTION: "preview"
    scripts:
      - name: "Verify environment, linked project and approval; Migration dry run"
        script: |
          bash scripts/codemagic_supabase.sh

